name: Build docker image

on:
  pull_request:
  push:
    branches:
    - master

    tags:
    - '*'
    - '!*-r[0-9]*'

env:
  BASE_IMAGE_REVISION: r0
  NGINX131: '1.31.6'
  NGINX130: '1.30.5'

jobs:
  nginx131-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          NGINX_VER: ${{ env.NGINX131 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          NGINX_VER: ${{ env.NGINX131 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  nginx131-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - nginx131-build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.NGINX131 }}
          latest: true
          latest_major: true
  
  nginx130-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          NGINX_VER: ${{ env.NGINX130 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          NGINX_VER: ${{ env.NGINX130 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  nginx130-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - nginx130-build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.NGINX130 }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ nginx131-push, nginx130-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
